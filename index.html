<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S.Editor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;align-items:center}
header{padding:18px 0 8px;font-size:28px;font-weight:700;letter-spacing:.5px}
header b{font-weight:700;background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#30d158,#0a84ff,#bf5af2,#ff3b30);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:fade 4s ease forwards,flow 4s linear infinite}
@keyframes fade{to{opacity:1}}@keyframes flow{to{background-position:300% 0}}
.hide{display:none!important}
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#home h2{margin:0;font-size:22px;font-weight:600}
#home p,#hint{margin:0;color:#aeaeb2;font-size:15px;max-width:300px;line-height:1.35}
.cover{position:relative;width:170px;height:170px;border-radius:30px;background:#2c2c2e;cursor:pointer;border:0;padding:0}
.cover:active{transform:scale(.97)}
.sun{position:absolute;left:24px;top:24px;width:20px;height:20px;border-radius:50%;background:#8e8e93;outline:3px dotted #8e8e93;outline-offset:4px}
.cloud{position:absolute;right:20px;top:28px;width:40px;height:14px;border-radius:8px;background:#8e8e93}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#8e8e93}
.cloud:before{width:20px;height:20px;left:6px;top:-11px}.cloud:after{width:15px;height:15px;right:6px;top:-7px}
.plus{position:absolute;right:22px;bottom:22px;width:28px;height:28px;background:linear-gradient(#8e8e93,#8e8e93) center/100% 4px no-repeat,linear-gradient(#8e8e93,#8e8e93) center/4px 100% no-repeat}
#work{flex:1;width:100%;display:flex;flex-direction:column;min-height:0;position:relative}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#box{position:relative}
canvas{display:block}#ov{position:absolute;left:0;top:0;touch-action:none}
#base{transition:none}
#ctr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:44px;font-weight:700;text-shadow:0 2px 12px #000a}
#emo{font-size:72px;display:inline-block;animation:spin 1.6s linear infinite;transition:opacity .35s}
#emo.out{opacity:0}@keyframes spin{to{transform:rotate(360deg)}}
#back{position:absolute;left:14px;top:4px;width:38px;height:38px;border-radius:50%;background:#2c2c2e;border:0;z-index:5}
#back:after{content:"";position:absolute;left:15px;top:12px;width:10px;height:10px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg)}
#dock{min-height:118px;padding:10px 16px 18px;display:flex;align-items:center;justify-content:center;position:relative}
#tools{display:flex;gap:26px}
.tool{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:#d1d1d6;font-size:12px;cursor:pointer}
.circ{width:62px;height:62px;border-radius:50%;background:#3a3a3c;display:flex;align-items:center;justify-content:center}
.tool:active .circ{background:#58585c}
.ic{position:relative;width:30px;height:30px}
.er{position:absolute;left:2px;top:9px;width:26px;height:13px;border-radius:3px;background:linear-gradient(90deg,#fff 55%,#9a9a9f 55%);transform:rotate(-40deg)}
.ic.e:after{content:"";position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:#fff;border-radius:1px}
.sc{position:absolute;left:7px;top:7px;width:16px;height:16px;border:2px solid #fff;border-radius:2px}
.sc i{position:absolute;width:8px;height:8px;border:0 solid #fff}
.sc i:nth-child(1){left:-8px;top:-8px;border-width:2px 0 0 2px}.sc i:nth-child(2){right:-8px;top:-8px;border-width:2px 2px 0 0}
.sc i:nth-child(3){left:-8px;bottom:-8px;border-width:0 0 2px 2px}.sc i:nth-child(4){right:-8px;bottom:-8px;border-width:0 2px 2px 0}
.pe{position:absolute;left:8px;top:2px;width:8px;height:17px;background:#fff;border-radius:2px 2px 0 0;transform:rotate(20deg)}
.pe:after{content:"";position:absolute;left:0;top:17px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:7px solid #fff}
.pl{position:absolute;right:0;bottom:0;width:11px;height:11px;background:linear-gradient(#fff,#fff) center/100% 2px no-repeat,linear-gradient(#fff,#fff) center/2px 100% no-repeat}
.btn{border:0;border-radius:999px;padding:15px 40px;font-size:17px;font-weight:700;color:#000;cursor:pointer}
.btn:active{transform:scale(.97)}
.y{background:#ffd60a}.g{background:#30d158}
#save.small{position:absolute;right:16px;bottom:22px;padding:10px 22px;font-size:15px}
#shapes{display:flex;gap:16px}
.shp{width:46px;height:46px;border-radius:12px;background:#3a3a3c;border:2px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.shp.on{border-color:#fff}.shp i{display:block;border:2px solid #fff}
</style></head><body>
<div id="app">
<header>S.<b>Editor</b></header>
<section id="home">
<h2>Photos</h2>
<button class="cover" id="pick" aria-label="Выбрать фото"><span class="sun"></span><span class="cloud"></span><span class="plus"></span></button>
<p>Выберите фотографию из библиотеки.</p>
</section>
<section id="work" class="hide">
<button id="back" class="hide" aria-label="Назад"></button>
<div id="stage"><div id="box"><canvas id="base"></canvas><canvas id="ov"></canvas><div id="ctr"><span id="pct"></span><span id="emo" class="hide"></span></div></div></div>
<div id="dock">
<div id="tools" class="hide">
<button class="tool" data-m="clean"><span class="circ"><span class="ic e"><span class="er"></span></span></span>Clean Up</button>
<button class="tool" data-m="crop"><span class="circ"><span class="ic"><span class="sc"><i></i><i></i><i></i><i></i></span></span></span>Масштаб</button>
<button class="tool" data-m="draw"><span class="circ"><span class="ic"><span class="pe"></span><span class="pl"></span></span></span>Дорисовка</button>
</div>
<p id="hint" class="hide"></p>
<button id="go" class="btn y hide">Clean Up</button>
<div id="shapes" class="hide">
<button class="shp" data-s="sq"><i style="width:20px;height:20px"></i></button>
<button class="shp" data-s="rh"><i style="width:26px;height:18px"></i></button>
<button class="shp" data-s="rv"><i style="width:18px;height:26px"></i></button>
<button class="shp" data-s="ci"><i style="width:22px;height:22px;border-radius:50%"></i></button>
<button class="shp" data-s="ov"><i style="width:28px;height:18px;border-radius:50%"></i></button>
</div>
<button id="save" class="btn g hide">Save</button>
</div>
</section>
</div>
<input type="file" id="file" accept="image/*" class="hide">
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const base=$('#base'),bx=base.getContext('2d'),ov=$('#ov'),ox=ov.getContext('2d');
const pct=$('#pct'),emo=$('#emo'),dock=['tools','hint','go','shapes','save'].map(i=>$('#'+i));
let tk=0,mode=null,pts=[],drawing=false,poly=null,crop=null,phase='';
const ptr=new Map();let pinch=0;
function show(...ids){dock.forEach(e=>e.classList.toggle('hide',!ids.includes(e.id)));$('#save').classList.remove('small')}
function fit(){if(!base.width)return;const st=$('#stage').getBoundingClientRect();
 const k=Math.min(st.width/base.width,st.height/base.height,1.5)||1,w=Math.floor(base.width*k),h=Math.floor(base.height*k);
 [base,ov].forEach(c=>{c.style.width=w+'px';c.style.height=h+'px'})}
addEventListener('resize',fit);
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{let im;try{im=await createImageBitmap(f,{imageOrientation:'from-image'})}catch{
  im=await new Promise((r,j)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);r(i)};i.onerror=j;i.src=u})}
 const w0=im.width,h0=im.height,k=Math.min(1,1600/Math.max(w0,h0));
 base.width=ov.width=Math.round(w0*k);base.height=ov.height=Math.round(h0*k);
 bx.drawImage(im,0,0,base.width,base.height);im.close&&im.close();
 $('#home').classList.add('hide');$('#work').classList.remove('hide');fit();intro()}
 catch(err){alert('Не удалось открыть изображение')}};
function intro(){const t=++tk;mode=null;ox.clearRect(0,0,ov.width,ov.height);show();$('#back').classList.add('hide');emo.classList.add('hide');pct.classList.remove('hide');
 base.style.filter='blur(26px)';pct.textContent='0%';const s=performance.now();
 (function f(n){if(t!==tk)return;const e=n-s,v=e<5000?68*e/5000:e<7000?68+32*(e-5000)/2000:100;
  pct.textContent=Math.round(v)+'%';base.style.filter='blur('+(v<68?26-18*v/68:8*(1-(v-68)/32)).toFixed(1)+'px)';
  if(e<8000)requestAnimationFrame(f);else{base.style.filter='none';pct.textContent='';tools()}})(s)}
function tools(){tk++;mode=null;phase='';poly=null;crop=null;ox.clearRect(0,0,ov.width,ov.height);base.style.filter='none';emo.classList.add('hide');pct.textContent='';$('#back').classList.add('hide');show('tools')}
$('#back').onclick=tools;
$$('.tool').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('#back').classList.remove('hide');
 if(mode==='crop'){phase='crop';crop=null;show('shapes');$$('.shp').forEach(x=>x.classList.remove('on'))}
 else{phase='select';$('#hint').textContent=mode==='clean'?'Обведите нужную область для стирания объектов.':'Выберите нужную область для дорисовки.';show('hint')}});
function pos(e){const r=ov.getBoundingClientRect();return[(e.clientX-r.left)*ov.width/r.width,(e.clientY-r.top)*ov.height/r.height]}
function rainbow(){const g=ox.createLinearGradient(0,0,ov.width,0);['#ff3b30','#ff9500','#ffd60a','#30d158','#0a84ff','#bf5af2'].forEach((c,i)=>g.addColorStop(i/5,c));return g}
function stroke(p,close){ox.clearRect(0,0,ov.width,ov.height);if(p.length<2)return;ox.lineJoin=ox.lineCap='round';ox.lineWidth=Math.max(4,ov.width/90);ox.strokeStyle=rainbow();
 ox.beginPath();p.forEach((q,i)=>i?ox.lineTo(q[0],q[1]):ox.moveTo(q[0],q[1]));if(close){ox.closePath();ox.fillStyle='rgba(255,255,255,.12)';ox.fill()}ox.stroke()}
function smooth(p){const q=p.concat([p[0]]);let L=[0];for(let i=1;i<q.length;i++)L.push(L[i-1]+Math.hypot(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]));
 const T=L[L.length-1];if(T<1)return null;const N=72,r=[];let j=1;
 for(let i=0;i<N;i++){const d=T*i/N;while(j<L.length-1&&L[j]<d)j++;const a=(d-L[j-1])/((L[j]-L[j-1])||1);r.push([q[j-1][0]+(q[j][0]-q[j-1][0])*a,q[j-1][1]+(q[j][1]-q[j-1][1])*a])}
 let s=r;for(let k=0;k<4;k++)s=s.map((c,i)=>{const a=s[(i+N-1)%N],b=s[(i+1)%N];return[(a[0]+c[0]*2+b[0])/4,(a[1]+c[1]*2+b[1])/4]});return s}
ov.addEventListener('pointerdown',e=>{
 if(phase==='crop'&&crop){ptr.set(e.pointerId,pos(e));ov.setPointerCapture(e.pointerId);pinch=0;return}
 if(phase!=='select')return;e.preventDefault();ov.setPointerCapture(e.pointerId);drawing=true;pts=[pos(e)];poly=null;show('hint')});
ov.addEventListener('pointermove',e=>{
 if(phase==='crop'&&crop&&ptr.has(e.pointerId)){const o=ptr.get(e.pointerId),n=pos(e);ptr.set(e.pointerId,n);
  if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)crop.k*=d/pinch;pinch=d}
  else{crop.cx+=n[0]-o[0];crop.cy+=n[1]-o[1]}drawCrop();return}
 if(!drawing)return;e.preventDefault();pts.push(pos(e));stroke(pts,false)});
const up=e=>{ptr.delete(e.pointerId);pinch=0;if(!drawing)return;drawing=false;
 if(pts.length<8){ox.clearRect(0,0,ov.width,ov.height);return}
 poly=smooth(pts);if(!poly){ox.clearRect(0,0,ov.width,ov.height);return}stroke(poly,true);phase='ready';show('go')};
ov.addEventListener('pointerup',up);ov.addEventListener('pointercancel',up);
ov.addEventListener('wheel',e=>{if(phase==='crop'&&crop){e.preventDefault();crop.k*=e.deltaY<0?1.05:.95;drawCrop()}},{passive:false});
$('#go').onclick=()=>{if(!poly)return;const t=++tk;phase='busy';base.style.filter='blur(14px)';ox.clearRect(0,0,ov.width,ov.height);show();
 $('#back').classList.add('hide');pct.textContent='';emo.classList.remove('hide');
 const seq=['⚡','🧢','🎮'];let i=0;emo.textContent=seq[0];emo.classList.remove('out');
 const step=()=>{if(t!==tk)return;i++;if(i>=seq.length){return finish(t)}
  emo.classList.add('out');setTimeout(()=>{if(t!==tk)return;emo.textContent=seq[i];emo.classList.remove('out');setTimeout(step,5650)},350)};
 setTimeout(step,6000-350+350)};
function finish(t){if(t!==tk)return;try{inpaint()}catch(e){console.error(e)}
 emo.classList.add('hide');base.style.filter='none';phase='done';poly=null;show('save');$('#save').classList.remove('small');$('#back').classList.remove('hide')}
function inpaint(){const W=base.width,H=base.height,m=document.createElement('canvas');m.width=W;m.height=H;const mc=m.getContext('2d');
 mc.fillStyle='#fff';mc.beginPath();poly.forEach((p,i)=>i?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1]));mc.fill();
 const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]),pad=0.15*Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))+6;
 const x0=Math.max(0,Math.floor(Math.min(...xs)-pad)),y0=Math.max(0,Math.floor(Math.min(...ys)-pad)),x1=Math.min(W,Math.ceil(Math.max(...xs)+pad)),y1=Math.min(H,Math.ceil(Math.max(...ys)+pad)),bw=x1-x0,bh=y1-y0;
 if(bw<4||bh<4)return;const sc=Math.min(1,128/Math.max(bw,bh)),w=Math.max(4,Math.round(bw*sc)),h=Math.max(4,Math.round(bh*sc));
 const mk=(src)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';x.drawImage(src,x0,y0,bw,bh,0,0,w,h);return[c,x]};
 const[sc_,sx]=mk(base),[,mx]=mk(m),d=sx.getImageData(0,0,w,h),md=mx.getImageData(0,0,w,h).data,n=w*h,M=new Uint8Array(n);
 const F=[new Float32Array(n),new Float32Array(n),new Float32Array(n)];let sum=[0,0,0],cnt=0;
 for(let i=0;i<n;i++){M[i]=md[i*4+3]>100?1:0;for(let c=0;c<3;c++)F[c][i]=d.data[i*4+c];if(!M[i]){cnt++;for(let c=0;c<3;c++)sum[c]+=F[c][i]}}
 if(!cnt)return;for(let i=0;i<n;i++)if(M[i])for(let c=0;c<3;c++)F[c][i]=sum[c]/cnt;
 for(let it=0;it<1500;it++)for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(!M[i])continue;
  const l=x>0?i-1:i,r=x<w-1?i+1:i,u=y>0?i-w:i,b=y<h-1?i+w:i;for(let c=0;c<3;c++){const f=F[c];f[i]=(f[l]+f[r]+f[u]+f[b])/4}}
 for(let i=0;i<n;i++)for(let c=0;c<3;c++)d.data[i*4+c]=F[c][i];sx.putImageData(d,0,0);
 const T=document.createElement('canvas');T.width=bw;T.height=bh;const tx=T.getContext('2d',{willReadFrequently:true});tx.imageSmoothingQuality='high';tx.drawImage(sc_,0,0,bw,bh);
 const td=tx.getImageData(0,0,bw,bh),a=td.data;for(let i=0;i<a.length;i+=4){const g=(Math.random()-.5)*10;a[i]+=g;a[i+1]+=g;a[i+2]+=g}tx.putImageData(td,0,0);
 const f=document.createElement('canvas');f.width=bw;f.height=bh;const fx=f.getContext('2d');if('filter' in fx)fx.filter='blur('+Math.max(2,bw/60)+'px)';fx.drawImage(m,x0,y0,bw,bh,0,0,bw,bh);
 tx.globalCompositeOperation='destination-in';tx.drawImage(f,0,0);bx.drawImage(T,x0,y0)}
/* Масштаб */
const R={sq:[1,1],rh:[1.33,1],rv:[1,1.33],ci:[1,1],ov:[1.33,1]};
$$('.shp').forEach(b=>b.onclick=()=>{$$('.shp').forEach(x=>x.classList.remove('on'));b.classList.add('on');const s=b.dataset.s,r=R[s],W=base.width,H=base.height,
 k=Math.min(W/r[0],H/r[1])*0.7;crop={s,cx:W/2,cy:H/2,k,r};drawCrop();$('#save').classList.add('small');$('#save').classList.remove('hide')});
function rect(){const W=base.width,H=base.height;let w=crop.r[0]*crop.k,h=crop.r[1]*crop.k;const f=Math.min(1,W/w,H/h);if(f<1){crop.k*=f;w*=f;h*=f}
 crop.cx=Math.min(W-w/2,Math.max(w/2,crop.cx));crop.cy=Math.min(H-h/2,Math.max(h/2,crop.cy));return[crop.cx-w/2,crop.cy-h/2,w,h]}
function shapePath(c,x,y,w,h){c.beginPath();if(crop.s==='ci'||crop.s==='ov')c.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);else c.rect(x,y,w,h)}
function drawCrop(){const[x,y,w,h]=rect();ox.clearRect(0,0,ov.width,ov.height);ox.fillStyle='rgba(120,120,120,.8)';ox.fillRect(0,0,ov.width,ov.height);
 ox.globalCompositeOperation='destination-out';shapePath(ox,x,y,w,h);ox.fill();ox.globalCompositeOperation='source-over'}
/* Save */
$('#save').onclick=async()=>{let c=base;
 if(phase==='crop'&&crop){const[x,y,w,h]=rect();c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);const cx=c.getContext('2d');
  shapePath(cx,0,0,c.width,c.height);cx.clip();cx.drawImage(base,x,y,w,h,0,0,w,h)}
 c.toBlob(async b=>{if(!b)return;const f=new File([b],'s-editor-'+Date.now()+'.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
  const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)},'image/png')};
})();
</script></body></html>
